name: Render CV, convert YAML->JSON and format

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch full history so we can rebase/pull safely before pushing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run RenderCV to build PDF
        run: |
          echo "Running rendercv..."
          rendercv render rendercv/resume.yaml \
            --pdf-path assets/pdf/CV_matteo_merler.pdf \
            --dont-generate-markdown --dont-generate-html --dont-generate-png

      - name: Convert YAML -> JSON
        run: |
          python3 bin/yaml_to_json_resume.py --in rendercv/resume.yaml --out assets/json/resume.json

      - name: Set up Node and Prettier
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node deps
        run: |
          npm ci

      - name: Run Prettier
        run: |
          npx prettier --write "**/*.{json,md,html,liquid,yml,yaml,css,js,ts}" || true

      - name: Commit changes and push back to triggering branch
        run: |
          # derive branch name from GITHUB_REF (refs/heads/<branch>)
          BRANCH="${GITHUB_REF#refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/json/resume.json || true
          git add assets/pdf/CV_matteo_merler.pdf || true
          git add . || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate resume.json and CV PDF [skip ci]"
            # try to integrate remote changes on the same branch first
            git pull --rebase origin "$BRANCH" || true
            # push to the branch that triggered the workflow (safer than forcing master)
            git push origin HEAD:"$BRANCH" || git push --force-with-lease origin HEAD:"$BRANCH"
          fi
