  sections:
    summary:
      - "I am a pre-doctoral researcher at FBK NLP in Trento, Italy, with an MSc in Machine Learning, Data Science, and AI from Aalto University in Helsinki. My research focuses on **bridging large-scale models** (such as LLMs and VLMs) **with methods like Reinforcement Learning (RL) and Symbolic Planning**. I aim to explore how RL's ability to learn from experience can complement the strengths of LLMs, which currently lack this capacity. I'm particularly interested in **model-based RL and world models**, investigating how large-scale models can be trained to plan ahead and imagine future states, helping them to adapt to complex reasoning and long-horizon planning beyond pattern matching."
    education:
      - institution: "Aalto University"
        area: "Machine Learning, Data Science and Artificial Intelligence"
        degree: "M.Sc."
        link: "https://www.aalto.fi/en/study-options/machine-learning-data-science-and-artificial-intelligence-master-of-science-technology"
        start_date: "2022-09-01"
        end_date: "2024-09-30"
        transcript: "transcript_matteo_merler_aalto.pdf"
        highlights:
          - Graduated with honors, with a **final grade of 5.0/5.0** and a **GPA of 5.0/5.0**.
          - "Thesis: [**Generating Code World Models with Large Language Models Guided by Monte Carlo Tree Search**](https://aaltodoc.aalto.fi/items/261e000b-a251-423a-b4f4-9f5c7de4a0f6), supervised by Prof. Pekka Marttinen, published at NeurIPS 2024."
          - "Thesis awarded as one of the three **best MSc theses of 2024** at the School of Science."
          - Received the Dean's Scholarship for outstanding academic performance.
          # - "**Relevant courses**: CS-E4890 Deep Learning, ELEC-E5550 Statistical Natural Language Processing, ELEC-E8125 Reinforcement Learning, CSE407517 Special Course in Machine Learning, Data Science and Artificial Intelligence: Seminar on NLP Research, CS-E4710 Machine Learning: Supervised Methods, CS-E4820 Machine Learning: Advanced Probabilistic Methods D, MS-E2122 Nonlinear Optimization D"
