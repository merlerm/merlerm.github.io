        position: "Researcher"
        link: "https://www.fbk.eu/en/"
        location: "Trento, Italy"
        start_date: "2025-01-07"
        end_date: "present"
        summary: Working as a pre-doctoral researcher ("Researcher 4 contract") in the [Natural Language Processing Lab](https://nlplab.fbk.eu/) under the supervision of Bernardo Magnini.
        highlights:
          - "Lead researcher on FBK's side of a joint project on **planning with Vision-Language Models** (with Aalto University), under resubmission."
          - "Led a second project on **selectively integrating VLM guidance with model-free Reinforcement Learning** based on the agent's own uncertainty, with a preliminary version accepted at the CAIPI workshop at ECAI 2025 and a full paper in preparation."
          - "Participating on private research for collaborations with companies."
          - "Contributing to the draft of a **Horizon Europe funding proposal**, leading the lab's team for Language and Reinforcement Learning."
          - "Active participation to the research group's scientific activities, including monthly meetings and collaborative discussions."
