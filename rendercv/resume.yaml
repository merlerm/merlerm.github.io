        transcript: "transcript_matteo_merler_unitn.pdf"
        highlights:
          - Graduated with a **final grade of 110/110 cum laude (with honors)** and a **GPA of 28.46/30**.
          - "Thesis: **Route Optimization for Indoor Spaces**, supervised by Prof. Alberto Montresor (in Italian)."
      - institution: "Liceo Scientifico Leonardo da Vinci"
